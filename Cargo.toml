[package]
name = "iottack"
version = "0.2.6"
edition = "2024"
authors = ["Fabian Affolter <fabian@affolter-engineering.ch>"]
description = "IoT protocol testing framework"
license = "MIT"
repository = "https://github.com/affolter-engineering/iottack"

[lib]
name = "iottack"
path = "src/lib.rs"

[[bin]]
name = "iottack"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serialport = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
inventory = "0.3"
mdns = "3.0.0"
async-std = "1"
futures = "0.3"
lapin = "4"
tokio = { version = "1", features = ["rt-multi-thread"] }
bluer = { version = "0.17", features = ["bluetoothd"] }
# GPL-3.0-or-later; see note in src/hardware/logic_analyser/capture.rs
libsigrok-sys = "0.1.1"
modbus = "1.1.3"

[patch.crates-io]
libsigrok-sys = { path = "vendor/libsigrok-sys" }
